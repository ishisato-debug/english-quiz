<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>red かるた</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Maru Gothic ProN', 'Comic Sans MS', sans-serif;
    background: linear-gradient(135deg, #ffe5e5, #fff5f5);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    font-size: 1.8rem;
    color: #c62828;
    margin-bottom: 14px;
    text-align: center;
    letter-spacing: 0.05em;
  }

  .screen {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* start */
  .start-card {
    background: white;
    border-radius: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    width: 100%;
    padding: 30px 24px;
    text-align: center;
  }
  .start-card p { font-size: 1.1rem; color: #555; line-height: 1.8; }

  .start-btn {
    background: #f4ac92;
    color: white;
    font-size: 1.4rem;
    font-weight: bold;
    padding: 18px 50px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 7px 0 #8e0000;
    transition: 0.1s;
    font-family: inherit;
  }
  .start-btn:active { transform: translateY(7px); box-shadow: none; }

  .home-btn {
    background: #fff;
    color: #c62828;
    border: 2px solid #f4ac92;
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
  }

  /* game */
  #screen-game { display: none; }

  #progress-wrap { font-size: 1rem; color: #888; }

  #progress-bar-wrap {
    width: 100%;
    height: 12px;
    background: #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    background: #f4ac92;
    border-radius: 8px;
    transition: width 0.4s;
    width: 0%;
  }

  #feedback {
    font-size: 1.2rem;
    font-weight: bold;
    color: #c62828;
    min-height: 1.6em;
    text-align: center;
  }

  #btn-replay {
    background: white;
    color: #c62828;
    border: 2px solid #f4ac92;
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 26px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 0 #f4ac92;
  }
  #btn-replay:active { transform: translateY(4px); box-shadow: none; }

  #card-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
  }

  .karuta-card {
    background: white;
    border: 3px solid #f4ac92;
    border-radius: 16px;
    min-height: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.35s, transform 0.35s, background 0.15s, border-color 0.15s;
    overflow: hidden;
  }
  .karuta-card:active { transform: scale(0.95); }
  .karuta-card.correct-taken { background: #d8f7d8; border-color: #4caf50; }
  .karuta-card.gone { opacity: 0; transform: scale(0.4); pointer-events: none; }
  .karuta-card.shake { animation: shake 0.4s; border-color: #e53935; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* clear */
  #screen-clear { display: none; }
  .clear-card {
    background: white;
    border-radius: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    width: 100%;
    padding: 30px 24px;
    text-align: center;
  }
  .clear-card h2 { font-size: 1.6rem; color: #c62828; margin-bottom: 10px; }
  .score-display { font-size: 2.6rem; font-weight: bold; color: #c62828; }
  .score-label { font-size: 1rem; color: #888; margin-top: 4px; }
</style>
</head>
<body>

<h1>🍎 えいたんごred かるた</h1>

<!-- Start -->
<div class="screen" id="screen-start">
  <div class="start-card">
    <p>ことばが きこえたら、<br>あう カードを タップしよう！</p>
  </div>
  <button class="start-btn" onclick="startGame()">🃏 スタート</button>
  <button class="home-btn" onclick="location.href='sumikko_karuta_select.html'">◀ シリーズえらぶ</button>
</div>

<!-- Game -->
<div class="screen" id="screen-game">
  <div id="progress-wrap">のこり <span id="remaining">0</span> / 60 まい</div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="feedback">🔊 きいてね...</div>
  <button id="btn-replay" onclick="replay()">🔊 もう一度きく</button>
  <div id="card-grid"></div>
</div>

<!-- Clear -->
<div class="screen" id="screen-clear">
  <div class="clear-card">
    <h2>🎉 ぜんぶ とれたよ！</h2>
    <div class="score-display" id="final-score">0</div>
    <div class="score-label">/ 60 まい</div>
  </div>
  <button class="start-btn" onclick="resetAll()">もう一度 🔄</button>
  <button class="home-btn" onclick="location.href='sumikko_karuta_select.html'">◀ シリーズえらぶ</button>
</div>

<script>
const allWords = ["Family", "father", "dad", "mother", "mom", "brother", "sister", "grandfather", "grandpa", "grandmother", "grandma", "aunt", "boy", "girl", "man", "woman", "friend", "children", "people", "lady", "hand", "finger", "foot", "hair", "head", "leg", "mouth", "face", "shoulder", "teeth", "doctor", "pilot", "singer", "waiter", "artist", "dancer", "driver", "nurse", "baseball", "basketball", "game", "soccer", "sport", "tennis", "camping", "fishing", "player", "racket", "softball", "team", "volleyball", "hiking", "jogging", "practice", "piano", "flute", "guitar", "violin", "drum", "trumpet"];
const totalCount = allWords.length;
const ROUND_SIZE = 16;

let deck = [];
let roundWords = [];
let takenIdx = new Set();
let targetIdx = -1;
let awaitingAnswer = false;
let correctCount = 0;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let preferredVoice = null;
function pickPreferredVoice() {
  if (!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  return voices.find(v => /en-US/i.test(v.lang) && /Samantha|Google US English|Female|Zira|Karen|Susan/i.test(v.name))
    || voices.find(v => /en-US/i.test(v.lang))
    || voices.find(v => /^en/i.test(v.lang))
    || null;
}
if (window.speechSynthesis) {
  preferredVoice = pickPreferredVoice();
  window.speechSynthesis.onvoiceschanged = () => { preferredVoice = pickPreferredVoice(); };
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.8;
  utter.pitch = 1.1;
  if (!preferredVoice) preferredVoice = pickPreferredVoice();
  if (preferredVoice) utter.voice = preferredVoice;
  window.speechSynthesis.speak(utter);
}

function fitCardFont(el) {
  let size = 19;
  el.style.fontSize = size + 'px';
  while ((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && size > 9) {
    size -= 1;
    el.style.fontSize = size + 'px';
  }
}

function renderGrid() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  roundWords.forEach((word, i) => {
    const div = document.createElement('div');
    div.className = 'karuta-card';
    div.id = 'card-' + i;
    div.textContent = word;
    div.onclick = () => onCardTap(i);
    grid.appendChild(div);
  });
  requestAnimationFrame(() => {
    roundWords.forEach((_, i) => fitCardFont(document.getElementById('card-' + i)));
  });
}

function updateProgress() {
  document.getElementById('remaining').textContent = totalCount - correctCount;
  document.getElementById('progress-bar').style.width = (correctCount / totalCount * 100) + '%';
}

function startRound() {
  roundWords = deck.splice(0, ROUND_SIZE);
  takenIdx = new Set();
  renderGrid();
  pickTarget();
}

function pickTarget() {
  const remainingIdx = roundWords.map((_, i) => i).filter(i => !takenIdx.has(i));
  if (remainingIdx.length === 0) {
    if (deck.length === 0) { showClear(); return; }
    startRound();
    return;
  }
  targetIdx = remainingIdx[Math.floor(Math.random() * remainingIdx.length)];
  awaitingAnswer = true;
  document.getElementById('feedback').textContent = '🔊 きいてね...';
  speak(roundWords[targetIdx]);
}

function replay() {
  if (awaitingAnswer && targetIdx >= 0) speak(roundWords[targetIdx]);
}

function onCardTap(i) {
  if (!awaitingAnswer || takenIdx.has(i)) return;
  if (i === targetIdx) {
    awaitingAnswer = false;
    takenIdx.add(i);
    correctCount++;
    const el = document.getElementById('card-' + i);
    el.classList.add('correct-taken');
    document.getElementById('feedback').textContent = '⭕ せいかい！';
    updateProgress();
    setTimeout(() => el.classList.add('gone'), 250);
    setTimeout(pickTarget, 750);
  } else {
    const el = document.getElementById('card-' + i);
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    document.getElementById('feedback').textContent = '❌ ちがうよ、もう一度きいてね';
  }
}

function startGame() {
  deck = shuffle([...allWords]);
  correctCount = 0;
  document.getElementById('screen-start').style.display = 'none';
  document.getElementById('screen-clear').style.display = 'none';
  document.getElementById('screen-game').style.display = 'flex';
  updateProgress();
  startRound();
}

function showClear() {
  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('screen-clear').style.display = 'flex';
  document.getElementById('final-score').textContent = correctCount;
}

function resetAll() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('screen-clear').style.display = 'none';
  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('screen-start').style.display = 'flex';
}
</script>
</body>
</html>
